<!DOCTYPE html>
<html lang="ta">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/catering.png">
    <title>Samiyar-Catering-Bill</title>

    <style>
        a {
            text-decoration: none;
            color: blueviolet;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif
        }

        body {
            background: #f3f4f6;
            padding: 20px
        }

        .container {
            max-width: 1200px;
            margin: auto
        }

        header {
            color: #111827;
            padding: 20px 10px 10px 10px;
            text-align: center;
            margin-bottom: 20px
        }

        .header-logo {
            max-height: 110px;
            width: auto;
            margin-bottom: 12px;
            object-fit: contain;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 8px
        }

        header p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 10px
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
            flex-wrap: wrap
        }

        .contact-info a {
            color: #2563eb;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s
        }

        .contact-info a:hover {
            color: #1d4ed8
        }

        .details,
        .bill-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: fixed
        }

        th {
            background: #111827;
            color: white
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            word-break: break-word
        }

        td:nth-child(2) {
            text-align: left;
            font-weight: bold
        }

        table input {
            width: 100%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            text-align: center
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        th:nth-child(1),
        td:nth-child(1) {
            width: 8%
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 44%
        }

        th:nth-child(3),
        td:nth-child(3) {
            width: 16%
        }

        th:nth-child(4),
        td:nth-child(4) {
            width: 16%
        }

        th:nth-child(5),
        td:nth-child(5) {
            width: 16%
        }

        .group-title {
            background: #dbeafe;
            font-weight: bold;
            font-size: 17px;
            color: #111827
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer
        }

        .clear-btn {
            background: #dc2626
        }

        footer {
            margin-top: 30px;
            color: #4b5563;
            padding: 20px 10px;
            text-align: center
        }

        footer a {
            color: #2563eb;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .pdf-mode .no-print,
        .pdf-mode .empty-row,
        .pdf-mode .empty-group {
            display: none !important;
        }

        @media(max-width:768px) {
            body {
                padding: 10px
            }

            .details,
            .bill-section {
                padding: 12px;
                border-radius: 10px
            }

            .detail-grid {
                grid-template-columns: 1fr;
                gap: 12px
            }

            header {
                padding: 18px 12px;
                margin-bottom: 15px;
            }

            .header-logo {
                max-height: 90px;
                margin-bottom: 10px;
            }

            header h1 {
                font-size: 26px
            }

            header p {
                font-size: 15px
            }

            .contact-info {
                font-size: 14px;
                gap: 12px
            }

            table {
                font-size: 12px
            }

            th,
            td {
                padding: 6px 3px
            }

            table input {
                padding: 4px 2px;
                font-size: 12px;
                border-radius: 4px;
                height: 28px
            }

            .buttons {
                flex-direction: column;
                gap: 10px
            }

            .buttons button {
                width: 100%;
                padding: 12px;
                font-size: 15px
            }
        }

        @media(max-width:480px) {
            header h1 {
                font-size: 22px
            }

            .contact-info {
                flex-direction: column;
                gap: 6px;
                align-items: center
            }

            th:nth-child(1),
            td:nth-child(1) {
                width: 10%
            }

            th:nth-child(2),
            td:nth-child(2) {
                width: 42%
            }

            th:nth-child(3),
            td:nth-child(3) {
                width: 16%
            }

            th:nth-child(4),
            td:nth-child(4) {
                width: 16%
            }

            th:nth-child(5),
            td:nth-child(5) {
                width: 16%
            }
        }

        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .container {
                box-shadow: none !important;
                padding: 0 !important;
                max-width: 100% !important;
                margin: 0 !important;
            }
            .details,
            .bill-section {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin-bottom: 15px !important;
                overflow-x: visible !important;
            }
            tr {
                page-break-inside: avoid !important;
            }
            .empty-row,
            .empty-group {
                display: none !important;
            }
            header {
                padding: 10px 0 !important;
                margin-bottom: 10px !important;
            }
            footer {
                margin-top: 15px !important;
                padding: 10px 0 !important;
            }
            input, table input {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                font-size: 14px !important;
                text-align: center !important;
                height: auto !important;
            }
            #customer {
                text-align: left !important;
                font-weight: bold !important;
                font-size: 16px !important;
            }
        }
    </style>
</head>

        function loadProducts() {
            const table = document.getElementById("productTable");
            table.innerHTML = "";
            let count = 1;

            for (const group in productGroups) {
                table.innerHTML += `
<tr class="group-title" data-group="${group}">
<td colspan="5">${group}</td>
</tr>`;

                productGroups[group].forEach(product => {
                    table.innerHTML += `
<tr class="product-row" data-group="${group}">
<td>${count++}</td>
<td>${product}</td>
<td><input type="number" placeholder="Kg"></td>
<td><input type="number" placeholder="Gram"></td>
<td><input type="number" placeholder="Number"></td>
</tr>`;
                });
            }
        }

        function preparePDF() {
            const allRows = document.querySelectorAll(".product-row");
            let totalFilled = 0;

            // Check if there is at least one filled input in the entire list
            allRows.forEach(row => {
                const inputs = row.querySelectorAll("input");
                let kg = inputs[0].value;
                let gram = inputs[1].value;
                let number = inputs[2].value;
                if (kg !== "" || gram !== "" || number !== "") {
                    totalFilled++;
                }
            });

            allRows.forEach(row => {
                const inputs = row.querySelectorAll("input");
                let kg = inputs[0].value;
                let gram = inputs[1].value;
                let number = inputs[2].value;

                if (totalFilled === 0) {
                    // Blank checklist mode: keep all rows visible
                    row.classList.remove("empty-row");
                } else {
                    // Invoice mode: hide empty rows
                    if (kg === "" && gram === "" && number === "") {
                        row.classList.add("empty-row");
                    } else {
                        if (kg === "") inputs[0].value = "0";
                        if (gram === "") inputs[1].value = "0";
                        if (number === "") inputs[2].value = "0";
                        row.classList.remove("empty-row");
                    }
                }
            });

            document.querySelectorAll(".group-title").forEach(groupRow => {
                const groupName = groupRow.getAttribute("data-group");
                const groupItems = document.querySelectorAll(`.product-row[data-group="${groupName}"]`);
                let hasItem = false;

                groupItems.forEach(item => {
                    if (!item.classList.contains("empty-row")) {
                        hasItem = true;
                    }
                });

                if (totalFilled === 0) {
                    // Blank checklist mode: keep all categories visible
                    groupRow.classList.remove("empty-group");
                } else {
                    // Invoice mode: hide empty categories
                    if (!hasItem) {
                        groupRow.classList.add("empty-group");
                    } else {
                        groupRow.classList.remove("empty-group");
                    }
                }
            });
        }

        function downloadPDFFile() {
            preparePDF();

            const element = document.getElementById("billArea");
            element.classList.add("pdf-mode");

            // Tiny delay to allow the browser to paint CSS visibility shifts before printing
            setTimeout(() => {
                window.print();
                element.classList.remove("pdf-mode");
            }, 150);
        }

        function clearAll() {
            document.querySelectorAll("tbody input").forEach(input => input.value = "");
            document.getElementById("customer").value = "";
            document.getElementById("date").valueAsDate = new Date();
        }

        loadProducts();
    </script>
